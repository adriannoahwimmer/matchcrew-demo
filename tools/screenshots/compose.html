<!doctype html>
<!-- Vorlage für hero.png (README, Englisch) und og.png (Link-Vorschau der Landingpage, Deutsch); gerendert von compose.mjs -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Barlow"; src: url("../../fonts/barlow-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Barlow"; src: url("../../fonts/barlow-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Barlow Condensed"; src: url("../../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: var(--w); height: var(--h); overflow: hidden; background: #172033; color: #fff; font-family: "Barlow", sans-serif;
  position: relative; }
.glow { position: absolute; width: 900px; height: 900px; right: -180px; top: -260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(242,107,33,0.28), rgba(242,107,33,0) 62%); }
.court { position: absolute; inset: 0; opacity: 0.07;
  background:
    radial-gradient(circle at 74% 50%, transparent 210px, #fff 211px, #fff 213px, transparent 214px),
    linear-gradient(90deg, transparent calc(74% - 1px), #fff calc(74% - 1px), #fff calc(74% + 1px), transparent calc(74% + 1px)); }
.text { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 450px; }
.brand { display: flex; align-items: center; gap: 14px; font: 600 40px/44px "Barlow Condensed", sans-serif; }
.mark { width: 48px; height: 48px; border-radius: 11px; background: #fff; display: grid; place-items: center; }
.mark::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: #F26B21; }
h1 { font: 600 50px/54px "Barlow Condensed", sans-serif; margin: 28px 0 18px; }
h1 em { font-style: normal; color: #F26B21; }
p { font: 400 20px/29px "Barlow", sans-serif; color: #C9D0DB; margin: 0 0 26px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font: 500 16px/20px "Barlow", sans-serif; padding: 7px 12px; border-radius: 8px; background: rgba(255,255,255,0.09); color: #E6EAF0; }
.phones { position: absolute; right: 52px; top: 50%; transform: translateY(-50%); width: 630px; height: 560px; }
.phone { position: absolute; width: 228px; border-radius: 34px; padding: 8px; background: #0B111D;
  box-shadow: 0 30px 60px rgba(0,0,0,0.45), 0 0 0 1.5px rgba(255,255,255,0.10); }
.phone img { display: block; width: 100%; border-radius: 27px; }
.p1 { left: 0; top: 52px; transform: rotate(-4deg); }
.p2 { left: 188px; top: 0; z-index: 2; width: 248px; }
.p3 { left: 396px; top: 52px; transform: rotate(4deg); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="court"></div>
<div class="text">
  <div class="brand"><span class="mark"></span>MatchCrew</div>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <div class="chips" id="chips"></div>
</div>
<div class="phones">
  <div class="phone p1"><img src="../../screenshots/gesuch.png" alt=""></div>
  <div class="phone p2"><img src="../../screenshots/entdecken.png" alt=""></div>
  <div class="phone p3"><img src="../../screenshots/chat.png" alt=""></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const lang = q.get("lang") || "de";
document.documentElement.style.setProperty("--w", (q.get("w") || 1280) + "px");
document.documentElement.style.setProperty("--h", (q.get("h") || 640) + "px");
const T = {
  de: { title: "Wer sitzt heute am <em>Kampfgericht?</em>",
        lead: "MatchCrew findet Ersatz für deinen Spieltagsdienst. Zum Start für Basketball in Karlsruhe.",
        chips: ["iOS", "Android", "Web"] },
  en: { title: "Who's at the <em>scorer's table</em> today?",
        lead: "A marketplace app that finds substitutes for game-day duties. Starting with basketball in Karlsruhe.",
        chips: ["Expo · React Native", "TypeScript", "Supabase", "iOS · Android · Web"] },
};
document.getElementById("title").innerHTML = T[lang].title;
document.getElementById("lead").textContent = T[lang].lead;
document.getElementById("chips").innerHTML = T[lang].chips.map((c) => `<span class="chip">${c}</span>`).join("");
</script>
</body>
</html>
